name: iOS Test Distribute

on:
  workflow_dispatch:
  push:
    branches:
      - test

jobs:
  update-version:
    name: Update Version Code
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Sleep 20
        run: |
          sleep 20

      - name: Update Info.plist
        id: update-plist
        run: |
          # Set the path to the Info.plist file
          PLIST_FILE="ios/SpendWise/Info.plist"  # Adjust this path based on your project structure

          # Ensure the file exists
          if [ ! -f "$PLIST_FILE" ]; then
              echo "❌ Error: Info.plist file not found at $PLIST_FILE"
              exit 1
          fi

          # Get the current CFBundleVersion (Build Number)
          CURRENT_BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$PLIST_FILE")

          # Check if the build number was retrieved successfully
          if [ -z "$CURRENT_BUILD_NUMBER" ]; then
              echo "⚠️ Warning: CFBundleVersion not found, setting to 1"
              CURRENT_BUILD_NUMBER=1
          else
              # Increment the build number
              NEW_BUILD_NUMBER=$((CURRENT_BUILD_NUMBER + 1))
          fi

          # Update the CFBundleVersion inside Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD_NUMBER" "$PLIST_FILE"

          echo "✅ Updated CFBundleVersion: $CURRENT_BUILD_NUMBER ➡️ $NEW_BUILD_NUMBER"

          # Output for next step
          echo "current_build=$NEW_BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "new_version=1.0" >> $GITHUB_OUTPUT

      - name: ✅ Commit and Push Changes with Retry
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add changes
          git add ios/SpendWise/Info.plist

          # Check if there are actual changes before committing
          if ! git diff --cached --quiet; then
            git commit -m "Test(iOS) - Bump to ${{ steps.update-plist.outputs.new_version }}(${{ steps.update-plist.outputs.current_build }})"

            # Retry push logic in case of conflicts
            n=0
            until [ "$n" -ge 3 ]; do
              git pull --rebase origin test || echo "Skipping rebase due to conflicts."
              git push origin test && break
              echo "⚠️ Push failed, retrying ($((n+1))/3)..."
              n=$((n+1))
              sleep 2
            done
          else
            echo "✅ No changes detected. Skipping commit."
          fi
